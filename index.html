<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f28c00"><title>Sportkantine Uren</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f3f3;color:#222}
header{background:#111;color:white;padding:15px;text-align:center}main{max-width:950px;margin:auto;padding:14px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}nav button{margin:0}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:block;font-weight:bold;margin-top:9px}input,select,textarea,button{width:100%;padding:11px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#f28c00;color:#fff;border:0;font-weight:bold}button.dark{background:#222}button.red{background:#b3261e}.hidden{display:none}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.badge{padding:4px 8px;border-radius:20px;background:#ddd;font-size:12px}.active{background:#d9f3df}.inactive{background:#eee}
.stat{font-size:25px;font-weight:bold}.msg{font-size:13px;color:#666;margin-top:8px}
</style>
</head>
<body>
<header><h2>Sportkantine Uren</h2><div id="status">Centrale administratie</div></header>
<main>
<nav>
<button onclick="show('register')">➕ Dienst</button>
<button onclick="show('overview')">📊 Overzicht</button>
<button onclick="show('calendar')">📅 Kalender</button>
<button onclick="adminLogin()">⚙️ Beheer</button>
</nav>

<section id="register" class="page">
<div class="card"><h3>Werkdienst registreren</h3>
<div class="grid">
<div><label>Medewerker</label><select id="employee"></select></div>
<div><label>Datum</label><input id="date" type="date"></div>
<div><label>Begin</label><input id="start" type="time"></div>
<div><label>Einde</label><input id="end" type="time"></div>
<div><label>Pauze (minuten)</label><input id="break" type="number" min="0" value="0"></div>
<div><label>Werkzaamheid</label><select id="work"><option>Bar</option><option>Keuken</option><option>Poetsen</option><option>Overige</option></select></div>
</div>
<div id="otherBox" class="hidden"><label>Overige werkzaamheden</label><input id="other"></div>
<label>Opmerking</label><textarea id="note"></textarea>
<button onclick="save()">Dienst opslaan</button><div id="msg" class="msg"></div>
</div></section>

<section id="overview" class="page hidden">
<div class="card"><h3>Urenoverzicht</h3>
<div class="grid"><div><div>Deze maand</div><div id="month" class="stat">0,00 uur</div></div><div><div>Dit jaar</div><div id="year" class="stat">0,00 uur</div></div></div>
<label>Medewerker</label><select id="filterEmployee" onchange="renderData()"></select>
</div>
<div class="card"><h3>Registraties</h3><div style="overflow:auto"><table><thead><tr><th>Datum</th><th>Medewerker</th><th>Tijd</th><th>Uren</th><th>Werk</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</section>

<section id="calendar" class="page hidden">
<div class="card"><h3>Jaar / maand</h3><div class="grid"><input id="calMonth" type="month"><select id="calEmp"></select></div>
<div id="cal" style="margin-top:15px"></div></div>
</section>

<section id="admin" class="page hidden">
<div class="card"><h3>Personeel beheren</h3>
<div class="grid"><div><label>Naam werknemer</label><input id="newName"></div><div><label>Pincode (optioneel)</label><input id="newPin" inputmode="numeric"></div></div>
<button onclick="addEmployee()">➕ Werknemer toevoegen</button><div id="adminMsg" class="msg"></div>
</div>
<div class="card"><h3>Werknemers</h3><div style="overflow:auto"><table><thead><tr><th>Naam</th><th>Status</th><th>Actie</th></tr></thead><tbody id="staff"></tbody></table></div></div>
</section>
</main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwffIYCFBU8RXLfMcjOsOSheqlOcCdUGS5UaKhZWP_2BDCzCoY1qij4ma6t8QY1WNYq/exec";
const ADMIN_PIN="1234"; // verander deze voor gebruik
let employees=[],data=[];
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);
$("calMonth").value=new Date().toISOString().slice(0,7);
$("work").onchange=()=>$("otherBox").classList.toggle("hidden",$("work").value!=="Overige");
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");if(id==="overview")renderData();if(id==="calendar")renderCalendar()}
function adminLogin(){let p=prompt("Beheerder pincode:");if(p===ADMIN_PIN){show("admin");renderStaff()}else if(p!==null)alert("Onjuiste pincode.")}
function hours(s,e,b){let a=s.split(":").map(Number),z=e.split(":").map(Number),m=z[0]*60+z[1]-(a[0]*60+a[1]);if(m<0)m+=1440;return Math.max(0,m-Number(b||0))/60}
function populate(){let active=employees.filter(x=>x.active);$("employee").innerHTML=active.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");$("filterEmployee").innerHTML='<option value="">Alle medewerkers</option>'+active.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");$("calEmp").innerHTML='<option value="">Alle medewerkers</option>'+active.map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}
async function api(method,payload){let r=await fetch(API_URL,{method,body:payload?JSON.stringify(payload):undefined});return r.json()}
async function load(){if(!API_URL.startsWith("http")){employees=[{id:"1",name:"Voorbeeld werknemer",active:true}];populate();return}try{let r=await api("GET");employees=r.employees||[];data=r.data||[];populate();renderData();}catch(e){$("status").textContent="Offline"}}
async function save(){let emp=$("employee").value;if(!emp||!$("start").value||!$("end").value){$("msg").textContent="Vul alle verplichte velden in.";return}let e=employees.find(x=>x.id===emp),w=$("work").value;if(w==="Overige"&&!$("other").value.trim()){alert("Vul de overige werkzaamheden in.");return}let d={action:"addShift",employeeId:emp,employee:e.name,date:$("date").value,start:$("start").value,end:$("end").value,breakMin:+$("break").value||0,hours:hours($("start").value,$("end").value,$("break").value),work:w,other:$("other").value,note:$("note").value};$("msg").textContent="Opslaan...";try{await api("POST",d);data.push(d);$("msg").textContent="Dienst opgeslagen.";renderData()}catch(x){$("msg").textContent="Opslaan mislukt."}}
async function addEmployee(){let name=$("newName").value.trim();if(!name){return}let d={action:"addEmployee",name,pin:$("newPin").value};try{let r=await api("POST",d);employees.push(r.employee||{id:Date.now().toString(),name,active:true});$("newName").value="";$("newPin").value="";populate();renderStaff();$("adminMsg").textContent="Werknemer toegevoegd."}catch(e){$("adminMsg").textContent="Opslaan mislukt."}}
async function toggleEmployee(id,active){let d={action:"setEmployeeActive",id,active};try{await api("POST",d);let x=employees.find(e=>e.id===id);if(x)x.active=active;populate();renderStaff()}catch(e){}}
function renderStaff(){$("staff").innerHTML=employees.map(e=>`<tr><td>${e.name}</td><td><span class="badge ${e.active?'active':'inactive'}">${e.active?'Actief':'Inactief'}</span></td><td><button class="${e.active?'red':'dark'}" onclick="toggleEmployee('${e.id}',${!e.active})">${e.active?'Deactiveren':'Activeren'}</button></td></tr>`).join("")}
function renderData(){let f=$("filterEmployee").value||"",now=new Date(),ym=now.toISOString().slice(0,7),yt=0,mt=0,rows=data.filter(x=>!f||x.employeeId===f);data.forEach(x=>{yt+=+x.hours||0;if(String(x.date).slice(0,7)===ym)mt+=+x.hours||0});$("month").textContent=mt.toFixed(2).replace(".",",")+" uur";$("year").textContent=yt.toFixed(2).replace(".",",")+" uur";$("rows").innerHTML=rows.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.employee}</td><td>${x.start}–${x.end}</td><td>${(+x.hours).toFixed(2)}</td><td>${x.work}${x.other?": "+x.other:""}</td></tr>`).join("")}
function renderCalendar(){let ym=$("calMonth").value,emp=$("calEmp").value,arr=data.filter(x=>String(x.date).slice(0,7)===ym&&(!emp||x.employeeId===emp));let [y,m]=ym.split("-").map(Number),days=new Date(y,m,0).getDate();let h="<div class='grid'>";for(let i=1;i<=days;i++){let ds=ym+"-"+String(i).padStart(2,"0"),a=arr.filter(x=>x.date===ds),tot=a.reduce((s,x)=>s+(+x.hours||0),0);h+=`<div class='card'><b>${i}</b><br>${tot?tot.toFixed(2)+" uur":"—"}<br><span class='small'>${a.map(x=>x.employee+" "+x.start+"-"+x.end).join("<br>")}</span></div>`}$("cal").innerHTML=h+"</div>"}
$("calMonth").onchange=renderCalendar;$("calEmp").onchange=renderCalendar;load();
</script></body></html>
